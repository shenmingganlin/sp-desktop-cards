<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>SP 桌面卡片</title>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="card.css" />
    <link rel="stylesheet" href="cards.css" />
  </head>
  <body>
    <!-- 图标画一次，两处引用：禁止符号（圆圈加斜杠）= 点不到 -->
    <svg class="sprite" aria-hidden="true"><symbol id="i-blocked" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.5" />
      <path d="M3.7 12.3 12.3 3.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </symbol></svg>
    <header id="head">
      <button id="collapse" class="icon" title="折叠/展开">▾</button>
      <div id="drag" title="拖动移动，拼在一起的整组一起走；按住 Alt 拖只挪这一张。双击折叠，右键出菜单。">
        <span id="title"></span>
        <span id="sub"></span>
      </div>
      <div id="tools"></div>
      <!-- 不挡点击开着时露出来：卡片这时点不动，留个禁止符号说明原因（展开、折叠都在顶栏） -->
      <span id="blocked-mark">
        <svg class="ico"><use href="#i-blocked" /></svg>
        <span class="label">不可点击</span>
      </span>
      <button id="menu" class="icon" title="菜单">⋯</button>
    </header>
    <div id="banner" hidden></div>
    <main id="body"></main>
    <footer id="foot"></footer>
    <div id="toast" hidden></div>
    <script src="chime.js"></script>
    <script src="card.js"></script>
    <script src="cards/focus.js"></script>
    <script src="cards/today.js"></script>
    <script src="cards/planner.js"></script>
    <script src="cards/schedule.js"></script>
    <script src="cards/month.js"></script>
    <script src="cards/stats.js"></script>
    <script src="cards/list.js"></script>
    <script src="cards/heatmap.js"></script>
    <script src="cards/triage.js"></script>
    <script src="cards/breakdown.js"></script>
    <script src="cards/finishday.js"></script>
    <script src="cards/boards.js"></script>
    <script src="boot.js"></script>
  </body>
</html>
